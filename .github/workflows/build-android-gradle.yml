name: Build Android Gradle APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Native Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease || gradle assembleRelease || true

      - name: Upload Gradle Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: native-apk-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Gradle Release APK
        uses: actions/upload-artifact@v4
        with:
          name: native-apk-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
